<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Quên mật khẩu</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  .auth { max-width: 380px; margin: 10vh auto 0; background: var(--panel);
          border: 1px solid var(--border-soft); border-radius: 12px; padding: 26px; }
  .auth h1 { font-size: 15px; color: #dfe6ee; text-align: center; margin: 0 0 6px; }
  .auth label { display: block; color: var(--muted); font-size: 11px; margin: 10px 0 4px; }
  .auth input { width: 100%; box-sizing: border-box; background: #161b22; border: 1px solid var(--border);
      color: var(--text); padding: 9px 12px; border-radius: 8px; font-family: inherit; font-size: 13.5px; }
  .auth button { width: 100%; margin-top: 16px; border: 1px solid rgba(78,161,255,.45);
                 background: linear-gradient(135deg, rgba(78,161,255,.25), rgba(124,92,255,.25));
                 color: var(--accent); padding: 10px; border-radius: 8px; cursor: pointer; }
  .auth .note { color: var(--amber); font-size: 12px; margin-top: 12px; word-break: break-word; }
  .auth .links { text-align: center; margin-top: 14px; font-size: 12px; }
  .auth .links a { color: var(--muted); }
</style>
</head>
<body>
<div class="auth">
  <h1>QUÊN MẬT KHẨU</h1>
  {% if notice %}<div class="note">{{ notice }}</div>{% endif %}
  <form method="post" action="{{ url_for('forgot') }}">
    <label>Tài khoản hoặc email</label>
    <input type="text" name="username" autofocus>
    <button type="submit">Tạo yêu cầu reset</button>
  </form>
  <div class="links"><a href="{{ url_for('login') }}">← đăng nhập</a></div>
</div>
</body>
</html>
